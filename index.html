<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />

    <link rel="canonical" href="https://www.my-icon.shop/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MYICON" />
    <meta property="og:title" content="MYICON — Individuell bedruckte Textilien & Druckprodukte" />

    <meta property="og:image" content="https://i.ibb.co/60ff2bwD/logo-text-1.png" />
    <meta property="og:locale" content="de_DE" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://i.ibb.co/60ff2bwD/logo-text-1.png" />

    <!-- Critical resource hints - establish connections early -->
    <link rel="preconnect" href="https://i.ibb.co" crossorigin />
    <link rel="preconnect" href="https://wlab-40444-default-rtdb.firebaseio.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- DNS prefetch for additional resources -->
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />
    <link rel="dns-prefetch" href="https://www.gstatic.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />

      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />

    <!-- Optimize for mobile performance -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Structured data: WebSite + Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MYICON",
      "url": "https://www.my-icon.shop/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.my-icon.shop/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "MYICON",
      "url": "https://www.my-icon.shop/",
      "logo": "https://i.ibb.co/60ff2bwD/logo-text-1.png",
      "description": "Online-Shop für individuell bedruckte Textilien und Druckprodukte.",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "myicon2025@gmail.com",
        "contactType": "customer support",
        "availableLanguage": "German"
      }
    }
    </script>
